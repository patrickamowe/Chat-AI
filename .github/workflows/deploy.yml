name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for MySQL
        run: |
          for i in {1..10}; do
            mysqladmin ping -h 127.0.0.1 -u root -prootpass && break
            sleep 3
          done

      - name: Run Alembic migrations against test DB
        env:
          DATABASE_URL: "mysql+pymysql://root:rootpass@127.0.0.1:3306/testdb"
          GEMINI_API_KEY: "test-dummy-key-not-real"
          JWT_ACCESS_SECRET: "test-secret-not-real"
          JWT_REFRESH_SECRET: "test-secret-not-real"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: "mysql+pymysql://root:rootpass@127.0.0.1:3306/testdb"
          GEMINI_API_KEY: "test-dummy-key-not-real"
          JWT_ACCESS_SECRET: "test-secret-not-real"
          JWT_REFRESH_SECRET: "test-secret-not-real"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
        run: pytest -v

  deploy-staging:
    name: Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku (Staging)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_STAGING_APP_NAME }}
        run: |
          heroku git:remote -a "$HEROKU_APP_NAME"
          git push heroku HEAD:refs/heads/main --force

      - name: Show release status
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_STAGING_APP_NAME }}
        run: heroku releases -a "$HEROKU_APP_NAME" -n 1

  deploy-production:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku (Production)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_PRODUCTION_APP_NAME }}
        run: |
          heroku git:remote -a "$HEROKU_APP_NAME"
          git push heroku HEAD:refs/heads/main --force

      - name: Show release status
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_PRODUCTION_APP_NAME }}
        run: heroku releases -a "$HEROKU_APP_NAME" -n 1