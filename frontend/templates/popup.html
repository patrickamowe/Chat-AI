<div id="signinModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeSignin">&times;</span>
        <h2>Sign In</h2>
        <form id="signin-form">
            <input type="text" name="username" placeholder="Username" id="signin-username" required autocomplete="username"><br><br>
            <input type="password" name="password" placeholder="Password" id="signin-password" required autocomplete="current-password"><br><br>
            <button type="submit" id="submit-signin-btn">Submit</button>
        </form>

        <div id="signin-message" class="error-message"></div>
    </div>
</div>

<div id="signupModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeSignup">&times;</span>
        <h2>Sign Up</h2>
        <form id="signup-form" method="POST">
            <input type="text" name="username" placeholder="Username" id="signup-username" required autocomplete="username"><br><br>
            <input type="email" name="email" placeholder="Email" id="signup-email" required autocomplete="email"><br><br>
            <input type="password" name="password" placeholder="Password" id="signup-password" required autocomplete="new-password"><br><br>
            <input type="password" name="confirm_password" placeholder="Confirm Password" id="signup-confirm-password" required autocomplete="new-password"><br><br>
            <button type="submit" id="submit-signup-btn">Register</button>
        </form>

        <div id="signup-message" class="error-message"></div>
</div>
